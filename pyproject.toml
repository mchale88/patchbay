[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchbay"
version = "1.0.0"
description = "Patchbay: headless router for NDI(R) sources with REST API, WebSocket events and web UI"
license = {file = "LICENSE"}
readme = "README.md"
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
patchbay = "patchbay.__main__:main"

[tool.setuptools]
packages = ["patchbay"]

[tool.setuptools.package-data]
patchbay = ["static/*"]
